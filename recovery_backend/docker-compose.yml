version: '3.8'

services:
  fatigue-recovery-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fatigue_recovery_microservice
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - PORT=8000
    volumes:
      - ./models:/app/models
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
